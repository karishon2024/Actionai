<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Action AI Slides</title>
<meta name="robots" content="noindex">
<style>
  :root{--navy:#344154;--teal:#20AD96;--paper:#F4F7F6;color-scheme:light}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--paper);color:var(--navy);font:16px/1.5 system-ui,sans-serif;padding:24px 16px;box-sizing:border-box}
  main{width:100%;max-width:520px}
  h1{font-size:32px;margin:0 0 4px}
  h1 span{color:#12806E}
  p{margin:0 0 24px;color:#5B6676}
  a{display:flex;justify-content:space-between;align-items:center;padding:18px 22px;border-radius:16px;background:#fff;color:var(--navy);text-decoration:none;font-weight:700;box-shadow:0 10px 30px rgba(20,30,45,.08)}
  a:hover,a:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
  a small{font-weight:500;color:#5B6676}
</style>
</head>
<body>
<main>
  <h1>Action <span>AI</span> slides</h1>
  <p>Class decks. Pick a week to open it.</p>
  <a href="/week4">Week 4 · Turn words into visuals <small>10 slides →</small></a>
</main>
</body>
</html>
